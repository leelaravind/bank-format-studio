# Release-quality gates for Bank Statement Format Studio (see
# docs/RELEASE-CHECKLIST.md). No signing, no publishing, no secrets:
# V1 ships unsigned per docs/UNSIGNED-RELEASE-POLICY.md and CI only
# validates; it never distributes artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Licence gate (SEC-20) + self-test proof
        run: |
          python tools/licence_gate.py --self-test
          python tools/licence_gate.py
      # -p no:pytest-qt — this job intentionally has no Qt binding installed
      # (GUI tests run in the dedicated gui job); without the flag the
      # pytest-qt plugin aborts the whole session at startup.
      - name: Unit / integration tests (warnings are errors via pyproject)
        run: pytest -p no:pytest-qt -m "not gui and not golden and not security" -q
      - name: Golden conversion suite
        run: pytest -p no:pytest-qt -m golden -q
      - name: Security suite (socket-blocking harness)
        run: pytest -p no:pytest-qt -m security -q

  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install with GUI extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: GUI smoke tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m gui -q

  hashed-install-proof:
    # SEC-20: prove the runtime dependency set installs with --require-hashes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hash-pinned install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
