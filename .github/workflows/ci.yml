name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Licence gate (SEC-20) + self-test proof
        run: |
          python tools/licence_gate.py --self-test
          python tools/licence_gate.py
      - name: Unit / integration / golden tests
        run: pytest -m "not gui" -q
      - name: Security suite (socket-blocking harness)
        run: pytest -m security -q

  hashed-install-proof:
    # SEC-20: prove the runtime dependency set installs with --require-hashes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hash-pinned install
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
